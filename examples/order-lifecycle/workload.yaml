apiVersion: chronicle.dev/v1alpha1
kind: Workload
metadata:
  name: order-lifecycle
  description: Semantic observations for the synthetic order lifecycle.
spec:
  events:
    inventory-requested:
      specversion: "1.0"
      id: inventory-requested-1
      source: /orders/order-1
      type: dev.chronicle.inventory.requested
      subject: order-1
      time: "2026-08-13T00:00:01Z"
      datacontenttype: application/json
      data:
        orderId: order-1
        sku: sku-1
        quantity: 1
    payment-requested:
      specversion: "1.0"
      id: payment-requested-1
      source: /orders/order-1
      type: dev.chronicle.payment.requested
      subject: order-1
      time: "2026-08-13T00:00:01Z"
      datacontenttype: application/json
      aggregateid: order-1
      aggregateversion: 1
      dataschema: scenarios/schemas/payment-requested.schema.json
      data:
        orderId: order-1
        amount: 1250
  observations:
    - id: inventory-events
      kafka:
        topic: inventory-events
        schemaFile: scenarios/schemas/inventory-requested.schema.json
        partition: 0
        startOffset: 0
        endOffset: 100
        mode: keyed
        keyPointer: /orderId
    - id: capture-effects
      effects:
        service: effect-sink
        port: 8080
        path: /v1/effects
        mode: ordered
  invariants:
    - id: one-capture-per-business-operation
      queryFile: scenarios/queries/duplicate-processed-events.sql
      classification: EXTERNAL_EFFECT_REGRESSION
  normalization:
    - id: remove-trace
      observation: inventory-events
      type: remove
      pointer: /traceId
  quiescence:
    timeout: 30s
    stabilityWindow: 2s
    conditions:
      - id: workflow-lag
        type: groupLagZero
        group: order-workflow
      - id: workflow-idle
        type: probeIdle
        service: order-workflow
      - id: checkpoints-clear
        type: checkpointsClear
        service: order-workflow
      - id: outbox-empty
        type: outboxEmpty
        service: order-workflow
      - id: effects-idle
        type: effectsIdle
        service: effect-sink
